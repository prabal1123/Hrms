{% extends "base.html" %}
{% block title %}Enter password{% endblock %}
{% block auth_content %}
<div class="card narrow">
    <h1>Enter your password</h1>
    <p class="small">Signing in as <strong>{{ pending_user.email|default:pending_user.username }}</strong></p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Login</button>
    </form>
    <p class="small">Not you? <a href="{% url 'login' %}">Use a different account</a></p>
</div>
{% endblock %}
