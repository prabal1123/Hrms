{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block auth_content %}
<div class="card narrow">
    <h1>Register</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Register</button>
    </form>
    <p class="small">Already have an account? <a href="{% url 'login' %}">Login</a></p>
</div>
{% endblock %}
