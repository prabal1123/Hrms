{% extends "base.html" %}
{% block title %}Create Organization{% endblock %}
{% block content %}
<div class="card narrow">
    <h1>Create organization</h1>
    <p class="muted">This is available only when you do not already belong to an organization.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Create organization</button>
    </form>
</div>
{% endblock %}
